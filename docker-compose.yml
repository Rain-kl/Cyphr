services:
  cyphr:
    image: ghcr.io/rain-kl/cyphr:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/sqlite:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyphr}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18+ 镜像要求挂载父目录（数据实际落在 18/docker 子目录）；旧式
      # ...:/var/lib/postgresql/data 会被视作废弃挂载而拒绝启动。
      - ./data/postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyphr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
