version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    # 基础检查
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

    # 代码坏味道与质量
    - revive
    - unconvert
    - nilerr
    - bodyclose
    - noctx
    - contextcheck
    - gocritic

  exclusions:
    rules:
      # errcheck: 忽略 Close/Remove/Setenv 返回值未检查
      - linters: [errcheck]
        text: "Error return value of `.*(Close|Remove|Setenv)` is not checked"

      # staticcheck QF1012: WriteString+Sprintf 惯用法在 TUI 代码中可接受
      - linters: [staticcheck]
        text: "QF1012"

      # revive: 未使用的回调参数
      - linters: [revive]
        text: "unused-parameter"

  settings:
    revive:
      rules:
        # 关闭对 CLI 工具无实际意义的规则
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

# 完整上报所有问题
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
